openapi: "3.0.3"
info:
  title: "TrashCanned API — Monitorização e Gestão de Resíduos Urbanos e Turísticos"
  version: "3.0.0"
  description: |
    Especificação OpenAPI 3.0.3 (v3) alinhada com a Arquitetura TrashCanned (API-Led Connectivity + Event-Driven + WebSockets) e com o Modelo de Domínio v2.
    
    Camadas Arquiteturais:
    - System APIs (/api/v1/system/...): Camada interna de abstração sobre PostgreSQL e o adaptador OpenRouteService (VROOM).
    - Process APIs (/api/v1/process/...): Orquestração de regras de negócio (Contas e acessos, Inventário, Monitorização 80%/95%, Alertas e Rotas).
    - Experience APIs (/api/v1/exp/...): Gateways dedicados por perfil (Admin, Técnico, Operador, Supervisor) e Parceiro (Portal da Câmara).
    
    Comunicação Assíncrona e Tempo Real:
    - Ingestão IoT: Simulador de sensores publica eventos MQTT (leitura.recebida a cada 15 min ou delta >= 10 pontos) no RabbitMQ, consumidos pelo Worker de ingestão.
    - Notificações Push: Process APIs publicam eventos (alerta.criado, rota.gerada) no RabbitMQ, entregues à Web App (React + Leaflet) pelo WebSocket Gateway (wss + JWT).
  contact:
    name: "Equipa Projeto Engenharia de Software - Universidade dos Açores"
servers:
  - url: "https://api.trashcanned-uac.pt/api/v1"
    description: "Servidor de Produção"
  - url: "http://localhost:8000/api/v1"
    description: "Ambiente Local de Desenvolvimento"
tags:
  - name: "System - Leituras"
    description: "Persistência e consulta histórica de leituras IoT (PostgreSQL)"
  - name: "System - Utilizadores"
    description: "Operações CRUD base sobre contas e perfis de utilizador"
  - name: "System - Sensores"
    description: "Operações CRUD base sobre sensores IoT e calibrações"
  - name: "System - Contentores"
    description: "Operações CRUD base sobre contentores, coordenadas e limiares (80% / 95%)"
  - name: "System - Alertas"
    description: "Persistência e atualização de estado de alertas operacionais"
  - name: "System - Rotas e Paragens"
    description: "Persistência de rotas, paragens ordenadas e recolhas efetuadas"
  - name: "System - Otimização (ORS)"
    description: "Adaptador interno para o motor OpenRouteService /optimization (VROOM)"
  - name: "Process - Contas e Acessos"
    description: "Autenticação JWT e gestão de utilizadores"
  - name: "Process - Inventário"
    description: "Orquestração do ciclo de vida de contentores, sensores e calibrações"
  - name: "Process - Monitorização"
    description: "Agregação de estado atual e séries temporais (limiares 80% / 95%)"
  - name: "Process - Alertas"
    description: "Criação, reconhecimento, resolução e publicação de eventos alerta.criado"
  - name: "Process - Rotas"
    description: "Geração otimizada, aprovação, ajuste, início de rota e registo de recolhas"
  - name: "Experience - Autenticação"
    description: "Login na plataforma Web (React + Leaflet)"
  - name: "Experience - Admin API"
    description: "Gateway de administração de contas, contentores, sensores e monitorização"
  - name: "Experience - Técnico API"
    description: "Gateway de manutenção de sensores, calibrações e alertas técnicos"
  - name: "Experience - Operador API"
    description: "Gateway operacional de mapa (OSM/Leaflet), rotas atribuídas, recolhas e alertas"
  - name: "Experience - Supervisor API"
    description: "Gateway de aprovação/ajuste de rotas, relatórios e supervisão de alertas"
  - name: "Experience - Parceiro API"
    description: "Gateway externo para o Portal da Câmara Municipal (consumidor institucional)"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT obtido em POST /exp/auth/login, contendo o ID e o perfil (role) do utilizador."
    apiKeyAuth:
      type: apiKey
      in: header
      name: "X-API-Key"
      description: "Chave de autenticação para comunicação interna entre camadas (Worker/Process -> System) e acesso do Portal da Câmara (Parceiro API)."
  parameters:
    PageParam:
      name: page
      in: query
      description: "Número da página para paginação (inicia em 1)."
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: "Número máximo de registos por página."
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: "Dados de entrada inválidos ou malformados."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: 400
            error: "Bad Request"
            message: "O campo nivel_enchimento deve estar compreendido entre 0 e 100."
            timestamp: "2026-10-19T14:30:00Z"
    Unauthorized:
      description: "Autenticação em falta, token JWT expirado ou API Key inválida."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: 401
            error: Unauthorized
            message: "Credenciais ou token de autenticação inválidos."
            timestamp: "2026-10-19T14:30:00Z"
    Forbidden:
      description: "O perfil do utilizador autenticado não tem permissão para executar esta operação."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: 403
            error: Forbidden
            message: "Acesso negado para o perfil atual."
            timestamp: "2026-10-19T14:30:00Z"
    NotFound:
      description: "O recurso solicitado não foi encontrado."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: 404
            error: "Not Found"
            message: "O identificador indicado não existe."
            timestamp: "2026-10-19T14:30:00Z"
    UnprocessableEntity:
      description: "Violação de regra de negócio (ex. iniciar rota ainda não aprovada)."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            status: 422
            error: "Unprocessable Entity"
            message: "Apenas rotas no estado APROVADA podem ser iniciadas."
            timestamp: "2026-10-19T14:30:00Z"
  schemas:
    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
        - timestamp
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Parâmetros inválidos no pedido."
        timestamp:
          type: string
          format: "date-time"
          example: "2026-10-19T14:30:00Z"
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "operador.silva@ecoacores.pt"
        password:
          type: string
          format: password
          minLength: 8
          example: "SenhaSegura2026!"
    AuthResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - utilizador
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        utilizador:
          "$ref": "#/components/schemas/Utilizador"
    Utilizador:
      type: object
      required:
        - id
        - nome
        - email
        - role
        - ativo
      properties:
        id:
          type: integer
          example: 12
        nome:
          type: string
          example: "João Silva"
        email:
          type: string
          format: email
          example: "operador.silva@ecoacores.pt"
        role:
          type: string
          enum:
            - ADMIN
            - SUPERVISOR
            - OPERADOR
            - TECNICO
          example: OPERADOR
        ativo:
          type: boolean
          example: true
        empresa:
          type: string
          nullable: true
          example: "EcoAçores Serviços Ambientais, Lda."
    UtilizadorCreateRequest:
      type: object
      required:
        - nome
        - email
        - password
        - role
      properties:
        nome:
          type: string
          example: "João Silva"
        email:
          type: string
          format: email
          example: "operador.silva@ecoacores.pt"
        password:
          type: string
          format: password
          minLength: 8
          example: "TempPass2026!"
        role:
          type: string
          enum:
            - ADMIN
            - SUPERVISOR
            - OPERADOR
            - TECNICO
          example: OPERADOR
        ativo:
          type: boolean
          default: true
        empresa:
          type: string
          nullable: true
          example: "EcoAçores Serviços Ambientais, Lda."
    UtilizadorUpdateRequest:
      type: object
      properties:
        nome:
          type: string
          example: "João Manuel Silva"
        role:
          type: string
          enum:
            - ADMIN
            - SUPERVISOR
            - OPERADOR
            - TECNICO
        ativo:
          type: boolean
          example: true
        empresa:
          type: string
          nullable: true
    Contentor:
      type: object
      required:
        - id
        - zona
        - localizacao
        - capacidade
        - nivel_atual
        - limiar_aviso
        - limiar_critico
      properties:
        id:
          type: string
          example: "CNT-MIR-004"
        zona:
          type: string
          example: "Miradouro da Vista do Rei"
        localizacao:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: float
          example:
            - 37.8396
            - -25.7942
        capacidade:
          type: number
          format: float
          example: 1100.0
        nivel_atual:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 82.5
        limiar_aviso:
          type: number
          format: float
          default: 80.0
          example: 80.0
        limiar_critico:
          type: number
          format: float
          default: 95.0
          example: 95.0
        ultima_recolha:
          type: string
          format: "date-time"
          nullable: true
          example: "2026-10-18T09:10:00Z"
    ContentorCreateRequest:
      type: object
      required:
        - id
        - zona
        - localizacao
        - capacidade
      properties:
        id:
          type: string
          example: "CNT-MIR-005"
        zona:
          type: string
          example: "Miradouro de Santa Iria"
        localizacao:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: float
          example:
            - 37.8185
            - -25.4951
        capacidade:
          type: number
          format: float
          example: 800.0
        nivel_atual:
          type: number
          format: float
          default: 0.0
        limiar_aviso:
          type: number
          format: float
          default: 80.0
        limiar_critico:
          type: number
          format: float
          default: 95.0
    ContentorPatchRequest:
      type: object
      properties:
        zona:
          type: string
        nivel_atual:
          type: number
          format: float
          minimum: 0
          maximum: 100
        limiar_aviso:
          type: number
          format: float
          minimum: 1
          maximum: 100
        limiar_critico:
          type: number
          format: float
          minimum: 1
          maximum: 100
        ultima_recolha:
          type: string
          format: "date-time"
          nullable: true
    Sensor:
      type: object
      required:
        - id
        - contentor_id
        - estado
      properties:
        id:
          type: string
          example: "SNS-MIR-004A"
        contentor_id:
          type: string
          example: "CNT-MIR-004"
        estado:
          type: string
          enum:
            - FUNCIONAL
            - AVARIADO
          example: FUNCIONAL
        ultima_comunicacao:
          type: string
          format: "date-time"
          nullable: true
          example: "2026-10-19T14:25:00Z"
    SensorCreateRequest:
      type: object
      required:
        - id
        - contentor_id
      properties:
        id:
          type: string
          example: "SNS-MIR-005A"
        contentor_id:
          type: string
          example: "CNT-MIR-005"
        estado:
          type: string
          enum:
            - FUNCIONAL
            - AVARIADO
          default: FUNCIONAL
    SensorPatchRequest:
      type: object
      properties:
        estado:
          type: string
          enum:
            - FUNCIONAL
            - AVARIADO
        ultima_comunicacao:
          type: string
          format: "date-time"
    LeituraInput:
      type: object
      required:
        - sensor_id
        - nivel_enchimento
        - data_hora
      properties:
        sensor_id:
          type: string
          example: "SNS-MIR-004A"
        nivel_enchimento:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 96.2
        data_hora:
          type: string
          format: "date-time"
          example: "2026-10-19T14:25:00Z"
    Leitura:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              example: 9842
        - "$ref": "#/components/schemas/LeituraInput"
    AlertaInput:
      type: object
      required:
        - contentor_id
        - tipo
        - descricao
      properties:
        contentor_id:
          type: string
          example: "CNT-MIR-004"
        tipo:
          type: string
          enum:
            - AVISO_ENCHIMENTO
            - ENCHIMENTO_CRITICO
            - SENSOR_AVARIADO
          example: ENCHIMENTO_CRITICO
        descricao:
          type: string
          example: "Contentor CNT-MIR-004 atingiu 96.2% (limiar crítico: 95%)."
    Alerta:
      type: object
      required:
        - id
        - contentor_id
        - tipo
        - data
        - descricao
        - estado
      properties:
        id:
          type: integer
          example: 305
        contentor_id:
          type: string
          example: "CNT-MIR-004"
        tipo:
          type: string
          enum:
            - AVISO_ENCHIMENTO
            - ENCHIMENTO_CRITICO
            - SENSOR_AVARIADO
          example: ENCHIMENTO_CRITICO
        data:
          type: string
          format: "date-time"
          example: "2026-10-19T14:25:02Z"
        descricao:
          type: string
          example: "Contentor CNT-MIR-004 atingiu 96.2% (limiar crítico: 95%)."
        estado:
          type: string
          enum:
            - ATIVO
            - RECONHECIDO
            - RESOLVIDO
          example: ATIVO
        reconhecido_por_id:
          type: integer
          nullable: true
          example: null
        resolvido_por_id:
          type: integer
          nullable: true
          example: null
    Paragem:
      type: object
      required:
        - id
        - ordem
        - contentor
        - recolhida
      properties:
        id:
          type: integer
          example: 51
        ordem:
          type: integer
          minimum: 1
          example: 1
        contentor:
          "$ref": "#/components/schemas/Contentor"
        recolhida:
          type: boolean
          example: false
    Rota:
      type: object
      required:
        - id
        - data
        - estado
        - paragens
      properties:
        id:
          type: integer
          example: 18
        data:
          type: string
          format: date
          example: "2026-10-20"
        hora_inicio:
          type: string
          format: "date-time"
          nullable: true
          example: null
        hora_fim:
          type: string
          format: "date-time"
          nullable: true
          example: null
        estado:
          type: string
          enum:
            - GERADA
            - APROVADA
            - EM_CURSO
            - CONCLUIDA
          example: APROVADA
        supervisor_id:
          type: integer
          nullable: true
          example: 4
        operador_id:
          type: integer
          nullable: true
          example: 12
        distancia_estimada_km:
          type: number
          format: float
          nullable: true
          example: 24.6
        duracao_estimada_min:
          type: integer
          nullable: true
          example: 48
        paragens:
          type: array
          items:
            "$ref": "#/components/schemas/Paragem"
    RotaCreateRequest:
      type: object
      required:
        - data
        - paragens
      properties:
        data:
          type: string
          format: date
          example: "2026-10-20"
        distancia_estimada_km:
          type: number
          format: float
          example: 24.6
        duracao_estimada_min:
          type: integer
          example: 48
        paragens:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - contentor_id
              - ordem
            properties:
              contentor_id:
                type: string
                example: "CNT-MIR-004"
              ordem:
                type: integer
                minimum: 1
                example: 1
    RotaAjusteRequest:
      type: object
      required:
        - paragens
      properties:
        operador_id:
          type: integer
          nullable: true
          example: 12
        paragens:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - contentor_id
              - ordem
            properties:
              contentor_id:
                type: string
                example: "CNT-MIR-004"
              ordem:
                type: integer
                minimum: 1
                example: 1
    RecolhaInput:
      type: object
      required:
        - data_hora
      properties:
        data_hora:
          type: string
          format: "date-time"
          example: "2026-10-20T09:15:00Z"
        observacoes:
          type: string
          nullable: true
          example: "Recolha efetuada sem anomalias."
    Recolha:
      type: object
      required:
        - id
        - paragem_id
        - operador_id
        - data_hora
      properties:
        id:
          type: integer
          example: 88
        paragem_id:
          type: integer
          example: 51
        operador_id:
          type: integer
          example: 12
        data_hora:
          type: string
          format: "date-time"
          example: "2026-10-20T09:15:00Z"
        observacoes:
          type: string
          nullable: true
    CalibracaoInput:
      type: object
      required:
        - data
        - observacoes
      properties:
        data:
          type: string
          format: "date-time"
          example: "2026-10-19T11:00:00Z"
        observacoes:
          type: string
          example: "Limpeza do sensor ultrassónico e recalibração."
        novo_estado:
          type: string
          enum:
            - FUNCIONAL
            - AVARIADO
          default: FUNCIONAL
    Calibracao:
      allOf:
        - type: object
          required:
            - id
            - sensor_id
            - tecnico_id
          properties:
            id:
              type: integer
              example: 24
            sensor_id:
              type: string
              example: "SNS-MIR-004A"
            tecnico_id:
              type: integer
              example: 7
        - "$ref": "#/components/schemas/CalibracaoInput"
    OtimizacaoRequest:
      type: object
      required:
        - ponto_partida
        - contentores
      properties:
        ponto_partida:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: float
          example:
            - 37.7412
            - -25.6756
        contentores:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - contentor_id
              - localizacao
              - nivel_atual
            properties:
              contentor_id:
                type: string
                example: "CNT-MIR-004"
              localizacao:
                type: array
                items:
                  type: number
                  format: float
                example:
                  - 37.8396
                  - -25.7942
              nivel_atual:
                type: number
                format: float
                example: 96.2
    OtimizacaoResponse:
      type: object
      required:
        - distancia_total_km
        - duracao_total_min
        - sequencia_paragens
      properties:
        distancia_total_km:
          type: number
          format: float
          example: 24.6
        duracao_total_min:
          type: integer
          example: 48
        sequencia_paragens:
          type: array
          items:
            type: object
            required:
              - contentor_id
              - ordem
            properties:
              contentor_id:
                type: string
                example: "CNT-MIR-004"
              ordem:
                type: integer
                example: 1
paths:
  "/system/leituras":
    post:
      tags:
        - "System - Leituras"
      summary: "Persistir leitura recebida pelo Worker de ingestão"
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LeituraInput"
      responses:
        "201":
          description: "Leitura persistida."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Leitura"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
    get:
      tags:
        - "System - Leituras"
      summary: "Consultar histórico paginado de leituras por sensor ou contentor"
      security:
        - apiKeyAuth: []
      parameters:
        - name: sensor_id
          in: query
          required: false
          schema:
            type: string
        - name: contentor_id
          in: query
          required: false
          schema:
            type: string
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: "date-time"
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: "date-time"
        - "$ref": "#/components/parameters/PageParam"
        - "$ref": "#/components/parameters/LimitParam"
      responses:
        "200":
          description: "Lista paginada de leituras."
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 250
                  page:
                    type: integer
                    example: 1
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Leitura"
  "/system/utilizadores":
    get:
      tags:
        - "System - Utilizadores"
      summary: "Listar utilizadores da base de dados"
      security:
        - apiKeyAuth: []
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum:
              - ADMIN
              - SUPERVISOR
              - OPERADOR
              - TECNICO
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
        - "$ref": "#/components/parameters/PageParam"
        - "$ref": "#/components/parameters/LimitParam"
      responses:
        "200":
          description: "Lista de utilizadores."
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Utilizador"
    post:
      tags:
        - "System - Utilizadores"
      summary: "Inserir novo utilizador na base de dados"
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UtilizadorCreateRequest"
      responses:
        "201":
