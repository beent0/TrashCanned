name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main/backend/package-lock.json
      - run: npm ci
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main/simulator/package-lock.json
      - run: npm ci
      - run: npm test

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Fails on errors only; the 105 style warnings in openapi_v5 are not blocking.
      - run: npx -y @redocly/cli@1 lint --extends minimal "Phase 3/Resources/APIs/openapi_v5.yaml"

  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
