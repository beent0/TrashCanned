openapi: 3.0.3
info:
  title: TrashCanned API — Monitorização e Gestão de Resíduos
  version: 5.0.0
  description: |
    Especificação OpenAPI 3.0.3 (v5, Fase 3), alinhada com a Arquitetura v5 (API-Led Connectivity + Event-Driven só com MQTT + WebSockets). Em relação à v4 muda apenas o transporte dos eventos: o RabbitMQ (MQTT + AMQP) foi substituído pelo Eclipse Mosquitto, e todos os eventos passam a ser mensagens MQTT. Os caminhos REST, os schemas e o RBAC não mudam.

    Camadas:
    - **Experience** (/exp): uma API para a Web App (React + Leaflet). JWT + RBAC por perfil (ADMIN, SUPERVISOR, OPERADOR, TECNICO). Deployment `experience`.
    - **Process** (/process): Contas e acessos, Inventário, Rotas, Relatórios (deployment `core`) e Monitorização e Alertas (microserviço com schema próprio, deployment `monitorizacao`).
    - **System** (/system): internas; acesso ao schema core do PostgreSQL e adaptador do OpenRouteService. Deployment `core`.

    Ingestão (fora do REST): o simulador publica por MQTT (tópico sensores/{sensor_id}/leitura, QoS 1, TLS na porta 8883) no Mosquitto, autenticado com as credenciais MQTT do sensor (plugin dynamic security; ACL só permite publicar no tópico do próprio sensor). A Monitorização subscreve $share/monitorizacao/sensores/+/leitura (subscrição partilhada MQTT 5): cada leitura é tratada por uma só réplica (evento leitura.recebida).

    Eventos (MQTT, QoS 1, sessões persistentes; nomes lógicos em x-eventos-publicados):
    | Evento | Tópico MQTT | Publicado por | Subscrito por |
    |---|---|---|---|
    | leitura.recebida | sensores/{sensor_id}/leitura | simulador | Monitorização ($share) |
    | contentor.atualizado | eventos/contentor/atualizado | Inventário | Monitorização ($share) |
    | recolha.registada | eventos/recolha/registada | Rotas | Monitorização ($share), WebSocket gateway |
    | nivel.atualizado | eventos/nivel/atualizado | Monitorização | WebSocket gateway |
    | alerta.criado | eventos/alerta/criado | Monitorização | WebSocket gateway |
    | alerta.atualizado | eventos/alerta/atualizado | Monitorização | WebSocket gateway |
    | rota.gerada | eventos/rota/gerada | Rotas | WebSocket gateway |
    | rota.atualizada | eventos/rota/atualizada | Rotas | WebSocket gateway |

    O WebSocket gateway (Socket.IO, wss + JWT) subscreve eventos/nivel/atualizado, eventos/alerta/#, eventos/rota/# e eventos/recolha/registada sem $share, para que cada réplica receba todos os eventos e os entregue aos seus clientes, filtrados por perfil. Mensagens inválidas são confirmadas (PUBACK), registadas e publicadas em erros/leituras (substitui a DLQ). A integração com a Câmara Municipal (tag Parceiro) está PINNED.
  contact:
    name: Equipa Projeto Engenharia de Software - Universidade dos Açores
servers:
- url: https://api.trashcanned-uac.pt/api/v1
  description: Produção
- url: http://localhost:8080/api/v1
  description: Desenvolvimento local (docker-compose)
tags:
- name: System - Utilizadores e empresas
- name: System - Contentores e sensores
- name: System - Rotas, paragens e depósitos
- name: System - Otimização (adaptador ORS)
- name: Process - Contas e acessos
- name: Process - Inventário
- name: Process - Monitorização e Alertas (microserviço)
  description: Serviço com schema próprio (monitorizacao). Consome leitura.recebida, contentor.atualizado e recolha.registada; publica alerta.criado
    e alerta.atualizado.
- name: Process - Rotas
- name: Process - Relatórios
- name: Experience - Web App
  description: A única Experience API (v4). RBAC pelo role do JWT; cada operação indica os perfis em x-roles.
- name: Experience - Parceiro (PINNED)
  description: 'PINNED — fora do âmbito da Fase 3: dados expostos e demonstração ainda por decidir.'
paths:
  /system/utilizadores:
    get:
      tags:
      - System - Utilizadores e empresas
      summary: Listar utilizadores
      security:
      - serviceAuth: []
      parameters:
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum:
          - ADMIN
          - SUPERVISOR
          - OPERADOR
          - TECNICO
      - name: email
        in: query
        required: false
        schema:
          type: string
          format: email
      - name: ativo
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Utilizador'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - System - Utilizadores e empresas
      summary: Inserir utilizador (password já em hash pelo Process)
      security:
      - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilizadorCreate'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilizador'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /system/utilizadores/{utilizadorId}:
    get:
      tags:
      - System - Utilizadores e empresas
      summary: Obter utilizador
      security:
      - serviceAuth: []
      parameters:
      - name: utilizadorId
        in: path
        required: true
        schema:
          type: integer
          example: 12
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilizador'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - System - Utilizadores e empresas
      summary: Atualizar utilizador (inclui ativo)
      security:
      - serviceAuth: []
      parameters:
      - name: utilizadorId
        in: path
        required: true
        schema:
          type: integer
          example: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilizadorUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilizador'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /system/empresas:
    get:
      tags:
      - System - Utilizadores e empresas
      summary: Listar empresas de recolha
      security:
      - serviceAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Empresa'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - System - Utilizadores e empresas
      summary: Inserir empresa
      security:
      - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaInput'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /system/auditoria:
    post:
      tags:
      - System - Utilizadores e empresas
      summary: Registar entrada de auditoria
      security:
      - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditoriaInput'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auditoria'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - System - Utilizadores e empresas
      summary: Consultar auditoria
      security:
      - serviceAuth: []
      parameters:
      - name: entidade
        in: query
        required: false
        schema:
          type: string
      - name: utilizador_id
        in: query
        required: false
        schema:
          type: integer
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Auditoria'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/Unauthorized'
  /system/contentores:
    get:
      tags:
      - System - Contentores e sensores
      summary: Listar contentores
      security:
      - serviceAuth: []
      parameters:
      - name: zona
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Contentor'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - System - Contentores e sensores
      summary: Inserir contentor
      security:
      - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentorCreate'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contentor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /system/contentores/{contentorId}:
    get:
      tags:
      - System - Contentores e sensores
      summary: Obter contentor
      security:
      - serviceAuth: []
      parameters:
      - name: contentorId
        in: path
        required: true
        schema:
          type: string
          example: CNT-MIR-004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contentor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - System - Contentores e sensores
      summary: Atualizar contentor (dados e ultima_recolha)
      security:
      - serviceAuth: []
      parameters:
      - name: contentorId
        in: path
        required: true
        schema:
          type: string
          example: CNT-MIR-004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ContentorPatch'
              - type: object
                properties:
                  ultima_recolha:
                    type: string
                    format: date-time
                    example: '2026-11-19T14:25:00Z'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contentor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - System - Contentores e sensores
      summary: 'Remover contentor (transação: revalida rotas ativas, desassocia sensor)'
      security:
      - serviceAuth: []
      parameters:
      - name: contentorId
        in: path
        required: true
        schema:
          type: string
          example: CNT-MIR-004
      responses:
        '204':
          description: Sem conteúdo
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /system/contentores/{contentorId}/dependencias:
    get:
      tags:
      - System - Contentores e sensores
      summary: Sensor associado e rotas ativas do contentor
      security:
      - serviceAuth: []
      parameters:
      - name: contentorId
        in: path
        required: true
        schema:
          type: string
          example: CNT-MIR-004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentorDependencias'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /system/sensores:
    get:
      tags:
      - System - Contentores e sensores
      summary: Listar sensores
      security:
      - serviceAuth: []
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          type: string
          enum:
          - FUNCIONAL
          - AVARIADO
      - name: contentor_id
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Sensor'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - System - Contentores e sensores
      summary: Inserir sensor
      security:
      - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorCreate'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /system/sensores/{sensorId}:
    get:
      tags:
      - System - Contentores e sensores
      summary: Obter sensor
      security:
      - serviceAuth: []
      parameters:
      - name: sensorId
        in: path
        required: true
        schema:
          type: string
          example: SNS-MIR-004A
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - System - Contentores e sensores
      summary: Atualizar sensor (associação ou estado)
      security:
      - serviceAuth: []
      parameters:
      - name: sensorId
        in: path
        required: true
        schema:
          type: string
          example: SNS-MIR-004A
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - System - Contentores e sensores
      summary: Remover sensor
      security:
      - serviceAuth: []
      parameters:
      - name: sensorId
        in: path
        required: true
        schema:
          type: string
          example: SNS-MIR-004A
      responses:
        '204':
          description: Sem conteúdo
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /system/sensores/{sensorId}/calibracoes:
    get:
      tags:
      - System - Contentores e sensores
      summary: Listar calibrações do sensor
      security:
      - serviceAuth: []
      parameters:
      - name: sensorId
        in: path
        required: true
        schema:
          type: string
          example: SNS-MIR-004A
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Calibracao'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - System - Contentores e sensores
      summary: Inserir calibração
      security:
      - serviceAuth: []
      parameters:
      - name: sensorId
        in: path
        required: true
        schema:
          type: string
          example: SNS-MIR-004A
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CalibracaoInput'
              - type: object
                properties:
                  tecnico_id:
                    type: integer
                required:
                - tecnico_id
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calibracao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /system/depositos:
    get:
      tags:
      - System - Rotas, paragens e depósitos
      summary: Listar depósitos
      security:
      - serviceAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deposito'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /system/depositos/{depositoId}:
    get:
      tags:
      - System - Rotas, paragens e depósitos
      summary: Obter depósito
      security:
      - serviceAuth: []
      parameters:
      - name: depositoId
        in: path
        required: true
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposito'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /system/rotas:
    get:
      tags:
      - System - Rotas, paragens e depósitos
      summary: Listar rotas
      security:
      - serviceAuth: []
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          type: string
          enum:
          - GERADA
          - APROVADA
          - EM_CURSO
          - CONCLUIDA
      - name: operador_id
        in: query
        required: false
        schema:
          type: integer
      - name: data
        in: query
        required: false
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Rota'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - System - Rotas, paragens e depósitos
      summary: Inserir rota com paragens (estado GERADA, uma transação)
      security:
      - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotaCreate'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rota'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /system/rotas/{rotaId}:
    get:
      tags:
      - System - Rotas, paragens e depósitos
      summary: Obter rota
      security:
      - serviceAuth: []
      parameters:
      - name: rotaId
        in: path
        required: true
        schema:
          type: integer
          example: 18
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rota'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - System - Rotas, paragens e depósitos
      summary: Atualizar estado, atribuição ou horários
      security:
      - serviceAuth: []
      parameters:
      - name: rotaId
        in: path
        required: true
        schema:
          type: integer
          example: 18
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotaAtualizacao'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rota'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /system/rotas/{rotaId}/paragens:
    put:
      tags:
      - System - Rotas, paragens e depósitos
      summary: Substituir paragens da rota
      security:
      - serviceAuth: []
      parameters:
      - name: rotaId
        in: path
        required: true
        schema:
          type: integer
          example: 18
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paragens:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/ParagemInput'
                distancia_estimada_km:
                  type: number
                otimizada:
                  type: boolean
              required:
              - paragens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rota'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /system/rotas/{rotaId}/paragens/{paragemId}/recolhas:
    post:
      tags:
      - System - Rotas, paragens e depósitos
      summary: Inserir recolha
      security:
      - serviceAuth: []
      parameters:
      - name: rotaId
        in: path
        required: true
        schema:
          type: integer
          example: 18
      - name: paragemId
        in: path
        required: true
        schema:
          type: integer
          example: 51
      requestBody:
        required: true
        content:
          application/json:
            schema:
