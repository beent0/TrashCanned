components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Emitido em POST /exp/auth/login; inclui id e role do utilizador.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de serviço para chamadas internas Experience → Process → System (rede interna do cluster).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Só para a integração PINNED com a Câmara Municipal. Os sensores NÃO usam API key: autenticam-se no broker MQTT.'
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Dados de entrada inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            error: Bad Request
            message: O campo limiar_critico deve ser maior do que limiar_aviso.
            timestamp: '2026-11-19T14:30:00Z'
    Unauthorized:
      description: Token em falta, expirado ou inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            error: Unauthorized
            message: Credenciais ou token inválidos.
            timestamp: '2026-11-19T14:30:00Z'
    Forbidden:
      description: O perfil não tem permissão (RBAC).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            error: Forbidden
            message: Acesso negado para o perfil atual.
            timestamp: '2026-11-19T14:30:00Z'
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            error: Not Found
            message: O identificador indicado não existe.
            timestamp: '2026-11-19T14:30:00Z'
    Conflict:
      description: Conflito com o estado atual (duplicado ou dependência).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            error: Conflict
            message: Já existe um recurso com este identificador.
            timestamp: '2026-11-19T14:30:00Z'
    Unprocessable:
      description: Regra de negócio violada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 422
            error: Unprocessable Entity
            message: Apenas rotas APROVADA atribuídas ao operador podem ser iniciadas.
            timestamp: '2026-11-19T14:30:00Z'
    Unavailable:
      description: Serviço externo indisponível.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 503
            error: Service Unavailable
            message: OpenRouteService não respondeu.
            timestamp: '2026-11-19T14:30:00Z'
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: O campo limiar_critico deve ser maior do que limiar_aviso.
        timestamp:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
      required:
      - status
      - error
      - message
      - timestamp
    Pagina:
      type: object
      properties:
        total:
          type: integer
          example: 45
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
      required:
      - total
      - page
      - limit
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: operador.silva@ecoacores.pt
        password:
          type: string
          format: password
          minLength: 8
          example: SenhaSegura2026!
      required:
      - email
      - password
    Empresa:
      type: object
      properties:
        id:
          type: integer
          example: 3
        nome:
          type: string
          example: EcoAçores Serviços Ambientais, Lda.
      required:
      - id
      - nome
    EmpresaInput:
      type: object
      properties:
        nome:
          type: string
          example: EcoAçores Serviços Ambientais, Lda.
      required:
      - nome
    Utilizador:
      type: object
      properties:
        id:
          type: integer
          example: 12
        nome:
          type: string
          example: João Silva
        email:
          type: string
          format: email
          example: operador.silva@ecoacores.pt
        role:
          type: string
          enum:
          - ADMIN
          - SUPERVISOR
          - OPERADOR
          - TECNICO
          example: OPERADOR
        ativo:
          type: boolean
          example: true
        empresa:
          allOf:
          - $ref: '#/components/schemas/Empresa'
          nullable: true
          description: Obrigatória quando role = OPERADOR
      required:
      - id
      - nome
      - email
      - role
      - ativo
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        utilizador:
          $ref: '#/components/schemas/Utilizador'
      required:
      - access_token
      - token_type
      - expires_in
      - utilizador
    UtilizadorCreate:
      type: object
      properties:
        nome:
          type: string
          example: João Silva
        email:
          type: string
          format: email
          example: operador.silva@ecoacores.pt
        password:
          type: string
          format: password
          minLength: 8
          example: TempPass2026!
        role:
          type: string
          enum:
          - ADMIN
          - SUPERVISOR
          - OPERADOR
          - TECNICO
          example: OPERADOR
        empresa_id:
          type: integer
          nullable: true
          example: 3
          description: Obrigatório quando role = OPERADOR
      required:
      - nome
      - email
      - password
      - role
    UtilizadorUpdate:
      type: object
      properties:
        nome:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - SUPERVISOR
          - OPERADOR
          - TECNICO
        ativo:
          type: boolean
          description: false = desativar a conta (não existe remoção; o histórico mantém-se)
        empresa_id:
          type: integer
          nullable: true
      minProperties: 1
    Contentor:
      type: object
      properties:
        id:
          type: string
          example: CNT-MIR-004
        zona:
          type: string
          example: Miradouro da Vista do Rei
        localizacao:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: double
          description: '[latitude, longitude] em WGS84'
          example:
          - 37.8396
          - -25.7942
        capacidade_l:
          type: number
          example: 1000
        nivel_atual:
          type: number
          minimum: 0
          maximum: 100
          example: 86.9
          readOnly: true
          description: Percentagem; atualizado pelo serviço de Monitorização
        nivel_estado:
          type: string
          enum:
          - NORMAL
          - AVISO
          - CRITICO
          example: AVISO
          readOnly: true
          description: 'Derivado: NORMAL < limiar_aviso ≤ AVISO < limiar_critico ≤ CRITICO'
        limiar_aviso:
          type: number
          example: 80
        limiar_critico:
          type: number
          example: 95
        ultima_recolha:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
          nullable: true
        sensor_id:
          type: string
          nullable: true
          example: SNS-MIR-004A
      required:
      - id
      - zona
      - localizacao
      - capacidade_l
      - limiar_aviso
      - limiar_critico
    ContentorCreate:
      type: object
      properties:
        id:
          type: string
          example: CNT-MIR-005
        zona:
          type: string
          example: Miradouro de Santa Iria
        localizacao:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: double
          description: '[latitude, longitude] em WGS84'
          example:
          - 37.8396
          - -25.7942
        capacidade_l:
          type: number
          exclusiveMinimum: true
          minimum: 0
          example: 800
        limiar_aviso:
          type: number
          minimum: 1
          maximum: 99
          default: 80
        limiar_critico:
          type: number
          minimum: 2
          maximum: 100
          default: 95
          description: Tem de ser maior do que limiar_aviso
      required:
      - id
      - zona
      - localizacao
      - capacidade_l
    ContentorPatch:
      type: object
      properties:
        zona:
          type: string
        localizacao:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: double
          description: '[latitude, longitude] em WGS84'
          example:
          - 37.8396
          - -25.7942
        capacidade_l:
          type: number
        limiar_aviso:
          type: number
        limiar_critico:
          type: number
      minProperties: 1
    ContentorDependencias:
      type: object
      properties:
        contentor_id:
          type: string
          example: CNT-MIR-004
        sensor_id:
          type: string
          nullable: true
          example: SNS-MIR-004A
        rotas_ativas:
          type: array
          items:
            type: integer
          example:
          - 18
          description: Rotas GERADA, APROVADA ou EM_CURSO que incluem o contentor
        pode_remover:
          type: boolean
          example: false
      required:
      - contentor_id
      - rotas_ativas
      - pode_remover
    Sensor:
      type: object
      properties:
        id:
          type: string
          example: SNS-MIR-004A
        tipo:
          type: string
          enum:
          - VOLUME
          example: VOLUME
        contentor_id:
          type: string
          nullable: true
          example: CNT-MIR-004
        estado:
          type: string
          enum:
          - FUNCIONAL
          - AVARIADO
          example: FUNCIONAL
        ultima_comunicacao:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
          nullable: true
        ultima_calibracao:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
          nullable: true
      required:
      - id
      - tipo
      - estado
    SensorCreate:
      type: object
      properties:
        id:
          type: string
          example: SNS-MIR-005A
        contentor_id:
          type: string
          nullable: true
          example: CNT-MIR-005
          description: Um contentor só pode ter um sensor (409 se já tiver)
      required:
      - id
    SensorPatch:
      type: object
      properties:
        contentor_id:
          type: string
          nullable: true
        estado:
          type: string
          enum:
          - FUNCIONAL
          - AVARIADO
      minProperties: 1
    CalibracaoInput:
      type: object
      properties:
        data:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
        leitura_referencia:
          type: number
          minimum: 0
          maximum: 100
          example: 0
          description: '%'
        correcao_pp:
          type: number
          minimum: -100
          maximum: 100
          example: 0.2
          description: pontos percentuais
        observacoes:
          type: string
          nullable: true
          example: Limpeza do sensor e recalibração.
        novo_estado:
          type: string
          enum:
          - FUNCIONAL
          - AVARIADO
          example: FUNCIONAL
          default: FUNCIONAL
      required:
      - data
      - leitura_referencia
      - correcao_pp
    Calibracao:
      allOf:
      - type: object
        properties:
          id:
            type: integer
            example: 24
          sensor_id:
            type: string
            example: SNS-MIR-004A
          tecnico_id:
            type: integer
            example: 7
        required:
        - id
        - sensor_id
        - tecnico_id
      - $ref: '#/components/schemas/CalibracaoInput'
    Leitura:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 9842
        sensor_id:
          type: string
          example: SNS-MIR-004A
        nivel_enchimento:
          type: number
          minimum: 0
          maximum: 100
          example: 96.2
        data_hora:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
      required:
      - id
      - sensor_id
      - nivel_enchimento
      - data_hora
      description: Leitura guardada pelo serviço de Monitorização (chegou por MQTT, não por REST)
    Alerta:
      type: object
      properties:
        id:
          type: integer
          example: 305
        tipo:
          type: string
          enum:
          - CONTENTOR_QUASE_CHEIO
          - CONTENTOR_CHEIO
          - SENSOR_SEM_COMUNICACAO
          example: CONTENTOR_CHEIO
        estado:
          type: string
          enum:
          - ATIVO
          - RECONHECIDO
          - RESOLVIDO
          example: ATIVO
        data:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
        descricao:
          type: string
          example: CNT-MIR-004 atingiu 96.2% (limiar crítico 95%).
        contentor_id:
          type: string
          example: CNT-MIR-004
        sensor_id:
          type: string
          nullable: true
          description: Preenchido em SENSOR_SEM_COMUNICACAO
        reconhecido_por_id:
          type: integer
          nullable: true
        resolvido_por_id:
          type: integer
          nullable: true
      required:
      - id
      - tipo
      - estado
      - data
      - descricao
      - contentor_id
    Deposito:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Depósito Ponta Delgada
        localizacao:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: double
          description: '[latitude, longitude] em WGS84'
          example:
          - 37.8396
          - -25.7942
      required:
      - id
      - nome
      - localizacao
    Paragem:
      type: object
      properties:
        id:
          type: integer
          example: 51
        ordem:
          type: integer
          minimum: 1
          example: 1
        contentor_id:
          type: string
          example: CNT-MIR-004
        recolhida:
          type: boolean
          readOnly: true
          example: false
          description: 'Derivado: existe recolha para a paragem'
      required:
      - id
      - ordem
      - contentor_id
      - recolhida
    ParagemInput:
      type: object
      properties:
        contentor_id:
          type: string
          example: CNT-MIR-004
        ordem:
          type: integer
          minimum: 1
          example: 1
      required:
      - contentor_id
      - ordem
    Rota:
      type: object
      properties:
        id:
          type: integer
          example: 18
        data:
          type: string
          format: date
          example: '2026-11-20'
        estado:
          type: string
          enum:
          - GERADA
          - APROVADA
          - EM_CURSO
          - CONCLUIDA
          example: APROVADA
        deposito_id:
          type: integer
          example: 1
        supervisor_id:
          type: integer
          nullable: true
          example: 4
        operador_id:
          type: integer
          nullable: true
          example: 12
        otimizada:
          type: boolean
          example: true
          description: false = ordem por vizinho mais próximo (ORS indisponível)
        distancia_estimada_km:
          type: number
          example: 24.6
        duracao_estimada_min:
          type: integer
          nullable: true
          example: 48
        hora_inicio:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
          nullable: true
        hora_fim:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
          nullable: true
        paragens:
          type: array
          items:
            $ref: '#/components/schemas/Paragem'
      required:
      - id
      - data
      - estado
      - deposito_id
      - otimizada
      - paragens
    RotaCreate:
      type: object
      properties:
        data:
          type: string
          format: date
          example: '2026-11-20'
        deposito_id:
          type: integer
          example: 1
        otimizada:
          type: boolean
          example: true
        distancia_estimada_km:
          type: number
          example: 24.6
        duracao_estimada_min:
          type: integer
          nullable: true
          example: 48
        paragens:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ParagemInput'
      required:
      - data
      - deposito_id
      - otimizada
      - paragens
      description: Persistida sempre com estado GERADA
    RotaAtualizacao:
      type: object
      properties:
        estado:
          type: string
          enum:
          - GERADA
          - APROVADA
          - EM_CURSO
          - CONCLUIDA
        supervisor_id:
          type: integer
          nullable: true
        operador_id:
          type: integer
          nullable: true
        hora_inicio:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
          nullable: true
        hora_fim:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
          nullable: true
      minProperties: 1
    GerarRotaRequest:
      type: object
      properties:
        data:
          type: string
          format: date
          example: '2026-11-20'
        deposito_id:
          type: integer
          example: 1
    AprovarRotaRequest:
      type: object
      properties:
        operador_id:
          type: integer
          example: 12
      required:
      - operador_id
    AjustarRotaRequest:
      type: object
      properties:
        paragens:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ParagemInput'
      required:
      - paragens
      description: A rota volta a GERADA e a distância é recalculada
    RecolhaInput:
      type: object
      properties:
        data_hora:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
        observacoes:
          type: string
          nullable: true
      required:
      - data_hora
    Recolha:
      type: object
      properties:
        id:
          type: integer
          example: 88
        paragem_id:
          type: integer
          example: 51
        operador_id:
          type: integer
          example: 12
        data_hora:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
        observacoes:
          type: string
          nullable: true
        rota_concluida:
          type: boolean
          example: false
          description: true se era a última paragem
      required:
      - id
      - paragem_id
      - operador_id
      - data_hora
    OtimizacaoRequest:
      type: object
      properties:
        ponto_partida:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: double
          description: '[latitude, longitude] em WGS84'
          example:
          - 37.8396
          - -25.7942
        contentores:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              contentor_id:
                type: string
              localizacao:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: number
                  format: double
                description: '[latitude, longitude] em WGS84'
                example:
                - 37.8396
                - -25.7942
            required:
            - contentor_id
            - localizacao
      required:
      - ponto_partida
      - contentores
    OtimizacaoResponse:
      type: object
      properties:
        distancia_total_km:
          type: number
          example: 24.6
        duracao_total_min:
          type: integer
          example: 48
        sequencia_paragens:
          type: array
          items:
            $ref: '#/components/schemas/ParagemInput'
      required:
      - distancia_total_km
      - duracao_total_min
      - sequencia_paragens
    Relatorio:
      type: object
      properties:
        tipo:
          type: string
          enum:
          - RECOLHAS
          - ZONAS
          - EFICIENCIA
          example: ZONAS
        periodo:
          type: object
          properties:
            inicio:
              type: string
              format: date
            fim:
              type: string
              format: date
        distribuicao_estado:
          type: object
          properties:
            normal:
              type: integer
            aviso:
              type: integer
            critico:
              type: integer
        recolhas_por_empresa:
          type: array
          items:
            type: object
            properties:
              empresa:
                type: string
                example: EcoAçores
              total:
                type: integer
                example: 7
        zonas:
          type: array
          items:
            type: object
            properties:
              zona:
                type: string
              media_enchimento:
                type: number
              ocorrencias_alerta:
                type: integer
        distancia_total_km:
          type: number
          example: 182.4
      required:
      - tipo
      - periodo
    Mapa:
      type: object
      properties:
        contentores:
          type: array
          items:
            $ref: '#/components/schemas/Contentor'
        rotas_visiveis:
          type: array
          items:
            $ref: '#/components/schemas/Rota'
          description: 'OPERADOR: só rotas atribuídas; SUPERVISOR/ADMIN: rotas APROVADA e EM_CURSO'
        deposito:
          $ref: '#/components/schemas/Deposito'
        atualizado_em:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
      required:
      - contentores
      - rotas_visiveis
    Auditoria:
      type: object
      properties:
        id:
          type: integer
        utilizador_id:
          type: integer
        acao:
          type: string
          example: UTILIZADOR_DESATIVADO
        entidade:
          type: string
          example: utilizadores
        entidade_id:
          type: string
          example: '12'
        data:
          type: string
          format: date-time
          example: '2026-11-19T14:25:00Z'
      required:
      - id
      - utilizador_id
      - acao
      - entidade
      - entidade_id
      - data
    AuditoriaInput:
      type: object
      properties:
        utilizador_id:
          type: integer
        acao:
          type: string
        entidade:
          type: string
        entidade_id:
          type: string
      required:
      - utilizador_id
      - acao
      - entidade
      - entidade_id
    IndicadoresMunicipais:
      type: object
      properties:
        periodo:
          type: string
          example: 2026-11-01 a 2026-11-30
        total_recolhas:
